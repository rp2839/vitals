[project]
name = "vitals"
version = "0.1.0"
description = "Hyprland/Linux system status display inspired by iStat Menus (battery & power first)"
requires-python = ">=3.11"

[project.scripts]
vitalsd = "vitals.daemon:main"
vitals-bar = "vitals.clients.bar:main"
vitalsctl = "vitals.clients.ctl:main"
vitals-panel = "vitals.clients.panel:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
